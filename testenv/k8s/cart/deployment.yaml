apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: cart
          image: cart:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: cart
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: demo
spec:
  selector:
    app: cart
  ports:
    - port: 8082
      targetPort: 8082
