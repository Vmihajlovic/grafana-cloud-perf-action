apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: product-catalog
          image: product-catalog:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_PATH
              value: /data/product-catalog.db
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: product-catalog
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.monitoring.svc.cluster.local:4040
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-catalog-data
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: demo
spec:
  selector:
    app: product-catalog
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-catalog-data
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
