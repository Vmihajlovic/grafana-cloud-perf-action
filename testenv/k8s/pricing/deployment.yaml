apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: pricing
          image: pricing:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: DATABASE_PATH
              value: /data/pricing.db
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: pricing
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.monitoring.svc.cluster.local:4040
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pricing-data
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  namespace: demo
spec:
  selector:
    app: pricing
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pricing-data
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
